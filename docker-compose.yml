# Local Postgres for the settlement platform.
name: paysettle
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: paysettle
      POSTGRES_USER: paysettle
      POSTGRES_PASSWORD: paysettle
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysettle"]
      interval: 5s
      retries: 20
volumes:
  pgdata:
