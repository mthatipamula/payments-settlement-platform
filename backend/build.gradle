plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.15'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'io.paysettle'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    // ISO 20022 message model (pacs.008 / pacs.002) used by Fedwire Funds since March 2025.
    implementation 'com.prowidesoftware:pw-iso20022:SRU2025-10.4.0'
    // Cluster-safe scheduling: only one Cloud Run instance runs a settlement sweep at a time.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.google.cloud.sql:postgres-socket-factory:1.30.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'paysettle.jar'
}

// Production image bundles the React console: (cd frontend && npm run build) && ./gradlew :backend:bootJar -PwithFrontend
if (project.hasProperty('withFrontend')) {
    tasks.named('processResources', ProcessResources) {
        from("${rootDir}/frontend/dist") { into 'static' }
    }
}
